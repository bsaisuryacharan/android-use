[project]
name = "android-use"
version = "0.3.0"
description = "MCP server that lets Claude see and control a real Android phone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The server is written against mcp.server.mcpserver, which is the 2.x
    # API; 1.x only has the old FastMCP module and fails at import.
    "mcp>=2.0,<3",
    "Pillow>=10.0.0",
    "websocket-client>=1.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
android-use = "android_use.server:main"
android-use-http = "android_use.http_server:main"
android-use-watchdog = "android_use.watchdog:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_use"]

[tool.pytest.ini_options]
testpaths = ["tests"]
