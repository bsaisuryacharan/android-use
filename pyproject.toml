[project]
name = "android-use"
version = "0.1.0"
description = "MCP server that lets Claude see and control a real Android phone over ADB"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "Pillow>=10.0.0",
    "websocket-client>=1.7",
]

[project.scripts]
android-use = "android_use.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_use"]
