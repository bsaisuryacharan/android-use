name: Python checks
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python-version }}' }
      - name: Install
        run: pip install -e ".[test]"
      - name: Import + syntax check
        run: |
          python -c "import android_use.server, android_use.app_backend, android_use.devices, android_use.http_server, android_use.watchdog; print('imports ok')"
          python -m compileall -q src/
      - name: Tests
        run: python -m pytest -q
